<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Mario</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="game-board">
        <img src="assets/images/clouds.png" class="clouds" alt="Nuvens">
        <img src="assets/images/pipe.png" class="pipe" alt="Cano">
        <img src="assets/images/mario.gif" class="mario" alt="Mario">
        <img src="assets/images/game-over.png" class="game-over" alt="Game Over">

        <div class="score">
            Pontuação: <span id="score">0</span>
        </div>

        <button id="restart-button">Reiniciar</button>

        <audio id="music" loop>
            <source src="assets/media/mario-music.ogg" type="audio/ogg">
            <source src="assets/media/mario-music.mp3" type="audio/mpeg">
        </audio>
    </main>

    <script src="js/game.js"></script>
</body>
</html>
